name: Build Typst articles

on:
  pull_request:
    paths:
      - "articles/**"
      - "templates/*.typ"
      - ".github/workflows/build-typst.yml"
  push:
    branches:
      - main
    paths:
      - "articles/**"
      - "templates/*.typ"
      - ".github/workflows/build-typst.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-typst-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Typst
        uses: typst-community/setup-typst@v5

      - name: Compile Typst articles
        run: |
          mkdir -p dist/articles
          shopt -s nullglob
          files=(articles/*.typ)
          if [ ${#files[@]} -eq 0 ]; then
            echo "Aucun fichier .typ dans articles/."
            exit 0
          fi
          for f in "${files[@]}"; do
            [[ "$(basename "$f")" == _* ]] && continue
            out="dist/articles/$(basename "${f%.typ}").pdf"
            echo "Compilation de $f -> $out"
            typst compile --root . "$f" "$out"
          done

      - name: Check Typst template
        run: typst compile --root . templates/article-template.typ /tmp/article-template.pdf

      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: articles-typst-pdf
          path: dist/articles/*.pdf
          if-no-files-found: ignore

      - name: Publish rolling release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          pdfs=(dist/articles/*.pdf)
          [ ${#pdfs[@]} -eq 0 ] && exit 0
          gh release delete articles-pdf --cleanup-tag --yes || true
          gh release create articles-pdf "${pdfs[@]}" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Articles (PDF, Typst)" \
            --notes "PDF compilés automatiquement depuis les fichiers .typ de articles/ au commit $GITHUB_SHA."
